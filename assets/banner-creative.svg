<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Akash Senthil — builds apps that ship">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b3d"/>
      <stop offset=".5" stop-color="#2d0b5a"/>
      <stop offset="1" stop-color="#03295e"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1">
      <stop offset="0" stop-color="#54c5f8">
        <animate attributeName="stop-color" values="#54c5f8;#ff5fa2;#ffd166;#54c5f8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ff5fa2">
        <animate attributeName="stop-color" values="#ff5fa2;#ffd166;#54c5f8;#ff5fa2" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="w1" x1="0" x2="1"><stop offset="0" stop-color="#54c5f8" stop-opacity=".55"/><stop offset="1" stop-color="#8a5cff" stop-opacity=".55"/></linearGradient>
    <linearGradient id="w2" x1="0" x2="1"><stop offset="0" stop-color="#ff5fa2" stop-opacity=".45"/><stop offset="1" stop-color="#54c5f8" stop-opacity=".45"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .name { opacity: 0; animation: rise 1.2s ease-out .2s forwards; }
      .sub  { opacity: 0; animation: rise 1.2s ease-out .8s forwards; }
      .dot  { animation: blink 2.4s ease-in-out infinite; }
      .dot:nth-of-type(2) { animation-delay: .8s; }
      .dot:nth-of-type(3) { animation-delay: 1.6s; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .name, .sub { animation: none; opacity: 1; } .dot { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <!-- stars -->
    <g fill="#ffffff">
      <circle class="dot" cx="140" cy="60" r="2"/><circle class="dot" cx="1020" cy="48" r="2.5"/><circle class="dot" cx="760" cy="90" r="1.8"/>
      <circle cx="320" cy="40" r="1.2" opacity=".5"/><circle cx="560" cy="30" r="1.4" opacity=".4"/><circle cx="1110" cy="120" r="1.2" opacity=".5"/><circle cx="60" cy="150" r="1.2" opacity=".4"/>
    </g>
    <!-- waves -->
    <path fill="url(#w1)">
      <animate attributeName="d" dur="9s" repeatCount="indefinite"
        values="M0 250 C200 210 400 290 600 250 C800 210 1000 290 1200 250 V320 H0Z;
                M0 250 C200 290 400 210 600 250 C800 290 1000 210 1200 250 V320 H0Z;
                M0 250 C200 210 400 290 600 250 C800 210 1000 290 1200 250 V320 H0Z"/>
    </path>
    <path fill="url(#w2)">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="M0 275 C250 300 450 240 700 272 C900 298 1050 250 1200 270 V320 H0Z;
                M0 270 C250 240 450 300 700 268 C900 242 1050 295 1200 275 V320 H0Z;
                M0 275 C250 300 450 240 700 272 C900 298 1050 250 1200 270 V320 H0Z"/>
    </path>
  </g>
  <g class="t" text-anchor="middle">
    <text class="name" x="600" y="140" font-size="72" font-weight="800" fill="url(#ink)" letter-spacing="-1">Akash Senthil</text>
    <text class="sub" x="600" y="190" font-size="24" font-weight="500" fill="#e6edf3" opacity=".9">I build Flutter apps that actually ship 🚀</text>
  </g>
</svg>
